<!DOCTYPE html>
<html lang="en" class="prism">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prism OS</title>
  <meta name="description" content="A liquid glass desktop run by a handwired neural program: drag, stack and spring three apps over drifting glass dunes and the network of weights.">
  <meta name="theme-color" content="#0f4f96" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1424" media="(prefers-color-scheme: dark)">
  <script>
    new MutationObserver((records, observer) => {
      const script = document.head.querySelector('script[type=module][src]')
      if (script === null) return
      script.setAttribute('blocking', 'render')
      observer.disconnect()
    }).observe(document.head, {childList: true})
  </script>
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./handwired-os.css">
  <link rel="stylesheet" href="./prism-os.css">
  <link rel="stylesheet" href="./cabinet.css">
</head>
<body>
  <main id="desktop" class="prism-desktop">
    <header id="system-bar">
      <button type="button" class="prism-brand" aria-label="About Prism OS">
        <svg class="prism-mark" viewBox="0 0 18 18" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M7.5 3.5L11 1.25l5.75 10.5-3.5 3.5z" fill="currentColor" opacity="0.5"/><path d="M1.75 15.25L7.5 3.5l5.75 11.75z" fill="currentColor"/></g></svg>
      </button>
      <span class="prism-front-app">Prism OS</span>
    </header>

    <canvas class="desk-wallpaper" aria-hidden="true"></canvas>
    <canvas class="desk-wiring" aria-hidden="true"></canvas>

    <section class="window">
      <div class="titlebar">
        <div class="window-title"><span class="app-dot app-dot-scope"></span>Scope</div>
        <div class="window-controls">
          <span class="window-button minimize"></span>
          <span class="window-button maximize"></span>
          <span class="window-button close"></span>
        </div>
      </div>
      <div class="window-content monitor-content">
        <nav class="monitor-sidebar"><strong>Neural desk</strong><div class="monitor-caption">The handwired program behind Prism OS</div></nav>
        <div class="monitor-list">
          <div class="monitor-header"></div>
          <div class="monitor-scroller">
            <div class="monitor-spacer"></div>
          </div>
          <div class="monitor-overflow"></div>
        </div>
        <footer class="monitor-footer"></footer>
      </div>
      <div class="resize-grip"></div>
    </section>

    <section class="window">
      <div class="titlebar">
        <div class="window-title"><span class="app-dot app-dot-ink"></span>Inkwell</div>
        <div class="window-controls">
          <span class="window-button minimize"></span>
          <span class="window-button maximize"></span>
          <span class="window-button close"></span>
        </div>
      </div>
      <div class="window-content notes-content">
        <textarea class="notes-text" aria-label="Note">Prism OS showcase

&ndash; A handwired neural program runs every window
&ndash; Glass windows over drifting dunes
&ndash; Drag a title bar, resize from a corner
&ndash; Open a photo in Chroma, read the circuit in Scope</textarea>
      </div>
      <div class="resize-grip"></div>
    </section>

    <section class="window">
      <div class="titlebar">
        <div class="window-title">
          <span class="app-dot app-dot-chroma"></span>Chroma
        </div>
        <div class="window-controls">
          <span class="window-button minimize"></span>
          <span class="window-button maximize"></span>
          <span class="window-button close"></span>
        </div>
      </div>
      <div class="window-content photos-content">
        <div class="photos-backdrop"></div>
        <div class="photos-control photos-previous"></div>
        <div class="photos-control photos-next"></div>
      </div>
      <div class="resize-grip"></div>
    </section>

    <nav id="dock" class="prism-dock">
      <span class="dock-wire"></span>
      <div class="dock-item dock-scope" title="Scope">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4.5" y="6" width="19" height="14" rx="3"/>
          <path d="M7.5 13h3l1.75-3.5 3.5 7 1.75-3.5h3"/>
          <path d="M11 23h6"/>
        </svg>
        <i></i>
      </div>
      <div class="dock-item dock-ink" title="Inkwell">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 9.5h12M8 14h12M8 18.5h7"/>
        </svg>
        <i></i>
      </div>
      <div class="dock-item dock-chroma" title="Chroma">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18.5" cy="9.5" r="2.5"/>
          <path d="M4.5 20.5l6-6.5 4.5 4.5 3-3 5.5 5"/>
        </svg>
        <i></i>
      </div>
    </nav>
  </main>
  <script type="module" blocking="render" src="../src/prismos/boot.ts"></script>
</body>
</html>
