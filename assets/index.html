<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HandwiredOS</title>
  <link rel="stylesheet" href="./window-manager.css">
</head>
<body>
  <main id="desktop">
    <header id="system-bar">
      <div class="system-mark"><span></span>HandwiredOS</div>
    </header>

    <section class="window window-files">
      <div class="titlebar">
        <div class="window-title"><span class="app-dot dot-files"></span>Files</div>
        <div class="window-controls">
          <span class="window-button minimize"></span>
          <span class="window-button maximize"></span>
          <span class="window-button close"></span>
        </div>
      </div>
      <!-- A list of the program's own operations. files.ts creates the header's cells and
           one row node per DOM slot, and the program gives each slot its row. -->
      <div class="window-content files-content">
        <div class="files-list">
          <div class="files-header"></div>
          <div class="files-scroller">
            <div class="files-spacer"></div>
          </div>
          <div class="files-overflow"></div>
        </div>
      </div>
      <div class="resize-grip"></div>
    </section>

    <section class="window window-notes">
      <div class="titlebar">
        <div class="window-title"><span class="app-dot dot-notes"></span>Notes</div>
        <div class="window-controls">
          <span class="window-button minimize"></span>
          <span class="window-button maximize"></span>
          <span class="window-button close"></span>
        </div>
      </div>
      <!-- The paragraph's words are spans that window-manager.ts creates and positions. -->
      <div class="window-content notes-content notes-flow"></div>
      <div class="resize-grip"></div>
    </section>

    <section class="window window-monitor">
      <div class="titlebar">
        <div class="window-title"><span class="app-dot dot-monitor"></span>System Monitor</div>
        <div class="window-controls">
          <span class="window-button minimize"></span>
          <span class="window-button maximize"></span>
          <span class="window-button close"></span>
        </div>
      </div>
      <div class="window-content monitor-content">
        <div class="monitor-heading"><span>COMPILED SYSTEM</span><strong>LIVE</strong></div>
        <div class="metric-row"><span>values</span><b id="monitor-values"></b></div>
        <div class="metric-row"><span>operations</span><b id="monitor-operations"></b></div>
        <div class="metric-row"><span>layers</span><b id="monitor-layers"></b></div>
        <div class="metric-row"><span>weights</span><b id="monitor-weights"></b></div>
        <div class="metric-row"><span>memory</span><b id="monitor-memory"></b></div>
        <div class="metric-row"><span>frame execution</span><b id="monitor-frame"></b></div>
        <div class="metric-row"><span>next RAF</span><b id="monitor-raf"></b></div>
      </div>
      <div class="resize-grip"></div>
    </section>

    <section class="window window-photos">
      <div class="titlebar">
        <div class="window-title">
          <span class="app-dot dot-photos"></span>Photos
        </div>
        <div class="window-controls">
          <span class="window-button minimize"></span>
          <span class="window-button maximize"></span>
          <span class="window-button close"></span>
        </div>
      </div>
      <div class="window-content photos-content">
        <div class="photos-backdrop"></div>
        <div class="photos-control photos-previous">&larr;</div>
        <div class="photos-control photos-next">&rarr;</div>
      </div>
      <div class="resize-grip"></div>
    </section>

    <nav id="dock">
      <div class="dock-item dock-files"><span>F</span><i></i></div>
      <div class="dock-item dock-notes"><span>N</span><i></i></div>
      <div class="dock-item dock-monitor"><span>M</span><i></i></div>
      <div class="dock-item dock-photos"><span>P</span><i></i></div>
    </nav>
  </main>
  <script type="module" src="../src/handwiredos/window-manager.ts"></script>
</body>
</html>
