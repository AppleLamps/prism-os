<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON highlighter</title>
  <style>
    :root {
      --background: #fbfbfa; --text: #1d1d1f; --muted: #6e6e73; --panel: #ffffff; --border: #d9d9de;
      --punctuation: #6e6e73; --key: #7c3aed; --string: #15803d; --escape: #b45309; --number: #1d4ed8;
      --literal: #be185d; --error: #dc2626; --match: rgb(250 204 21 / 0.45);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #161618; --text: #ececf0; --muted: #9a9aa2; --panel: #1f1f22; --border: #34343a;
        --punctuation: #9a9aa2; --key: #c4b5fd; --string: #86efac; --escape: #fbbf24; --number: #93c5fd;
        --literal: #f9a8d4; --error: #f87171; --match: rgb(250 204 21 / 0.3);
      }
    }
    body {margin: 0; background: var(--background); color: var(--text); font: 14px/1.45 system-ui, sans-serif}
    main {max-width: 760px; margin: 0 auto; padding: 24px 16px}
    h1 {font-size: 18px; margin: 0 0 4px}
    p {margin: 0 0 12px; color: var(--muted)}
    .editor {position: relative; height: 420px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden}
    .editor pre, .editor textarea {
      position: absolute; inset: 0; margin: 0; padding: 12px; box-sizing: border-box; width: 100%; height: 100%;
      font: 13px/20px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow: auto; tab-size: 4;
      border: 0; letter-spacing: 0;
    }
    .editor pre {pointer-events: none; color: var(--text)}
    .editor textarea {background: transparent; color: transparent; caret-color: var(--text); resize: none; outline: none}
    .k0 {} .k1 {color: var(--punctuation)} .k2 {color: var(--string)} .k3 {color: var(--escape)} .k4 {color: var(--number)}
    .k5 {color: var(--literal)} .k6 {color: var(--error)} .k8 {color: var(--key)}
    .match {background: var(--match); border-radius: 2px}
    .first-error {text-decoration: underline wavy var(--error); text-decoration-skip-ink: none}
    .end-marker {display: inline-block; width: 7px; height: 16px; vertical-align: -3px; background: var(--error); opacity: 0.6}
    .past-capacity {color: var(--muted); opacity: 0.6}
    .status {margin-top: 10px; min-height: 20px}
    .status .bad {color: var(--error)}
    .timings {margin-top: 4px; color: var(--muted); font-size: 12px}
  </style>
</head>
<body>
  <main>
    <h1>JSON highlighter</h1>
    <p>Every keystroke writes up to 512 code points and the caret into one numeric program, which returns a kind per character, the first error and the matching bracket. Tab types a tab, and Escape then Tab moves focus out of the editor.</p>
    <div class="editor"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="JSON text"></textarea></div>
    <div class="status" aria-live="polite"></div>
    <div class="timings"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
