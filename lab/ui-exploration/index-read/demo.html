<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Index read</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main class="panels">
    <section class="panel">
      <header class="panel-header">
        <h1>10,000 rows through 24 DOM slots</h1>
        <label>
          circuit
          <select id="construction">
            <option value="instruction">index read instruction</option>
            <option value="lowered">relu one-hot, resolved from its index</option>
            <option value="gather">relu one-hot, bit gather (shared runtime)</option>
          </select>
        </label>
      </header>
      <p class="stats" id="list-stats"></p>
      <div class="scroller" id="scroller">
        <div class="spacer" id="spacer"></div>
      </div>
    </section>
    <section class="panel">
      <header class="panel-header">
        <h1>221 photos, centered on the focused one</h1>
      </header>
      <p class="stats" id="strip-stats"></p>
      <div class="strip" id="strip"></div>
      <p class="hint">Left and right arrow keys, or click a photo.</p>
    </section>
  </main>
  <script type="module" src="./demo.ts"></script>
</body>
</html>
