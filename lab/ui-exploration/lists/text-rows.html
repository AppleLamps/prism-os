<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circuit Text Rows</title>
  <style>
    body { margin: 0; font: 14px system-ui; background: #f4f4f2; color: #222; }
    header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    #stats { font: 12px ui-monospace, monospace; color: #555; width: 100%; white-space: pre-wrap; min-height: 45px; }
    /* overflow-anchor: none turns off the browser's own scroll anchoring, so only the program moves the view. */
    #scroller { position: relative; box-sizing: border-box; width: 800px; max-width: calc(100vw - 32px); height: calc(100vh - 150px); margin: 0 16px; overflow-y: scroll; overflow-x: hidden; overflow-anchor: none; background: white; border: 1px solid #ddd; }
    #spacer { position: relative; }
    /* The text box is the row's width minus 24 px on the left and 20 px on the right, like an hn-thread comment. */
    .row { position: absolute; left: 0; top: 0; box-sizing: border-box; padding: 8px 20px 8px 24px; overflow: hidden; background: white; }
    .row.odd { background: #f6f6f1; }
    /* A row laid out at its minimum width, wider than the container. */
    .row.clamped { box-shadow: inset 3px 0 0 #e0a040; }
    .text { font: 12px/14px Verdana, Geneva, sans-serif; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <header>
    <label>Container width <input id="width" type="range" min="375" max="1200" step="1"> <span id="width-value"></span></label>
    <button id="append-one" type="button">Append a message</button>
    <button id="append-many" type="button">Append 100</button>
    <label><input id="auto-append" type="checkbox"> Append every 100 ms</label>
    <button id="edit-above" type="button">Edit a row above the view</button>
    <button id="to-top" type="button">Scroll to the top</button>
    <div id="stats">Preparing rows…</div>
  </header>
  <div id="scroller"><div id="spacer"></div></div>
  <script type="module" src="./text-rows-demo.ts"></script>
</body>
</html>
