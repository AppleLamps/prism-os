<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings panel, one circuit</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main id="settings-demo">
    <div class="settings-panel"><h1 class="settings-title">Settings</h1></div>
    <div class="settings-row"><span>Wi-Fi</span></div>
    <div class="settings-row"><span>Bluetooth</span></div>
    <div class="settings-row"><span>Reduce motion</span></div>
    <div class="settings-switch" role="switch" aria-checked="false"></div>
    <div class="settings-switch" role="switch" aria-checked="false"></div>
    <div class="settings-switch" role="switch" aria-checked="false"></div>
    <div class="settings-knob"></div>
    <div class="settings-knob"></div>
    <div class="settings-knob"></div>
    <div class="settings-pill"></div>
    <div class="settings-segment">Light</div>
    <div class="settings-segment">Dark</div>
    <div class="settings-segment">Auto</div>
    <div class="settings-track"><i class="settings-fill"></i></div>
    <div class="settings-slider-knob"></div>
    <div class="settings-reset">Reset</div>
    <footer id="settings-stats"></footer>
  </main>
  <script type="module" src="./demo.ts"></script>
</body>
</html>
