<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Bank Predictive Keyframes</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 14px system-ui, sans-serif; background: #111827; color: #d1d5db; }
    #stage { position: fixed; inset: 0; }
    .box { position: absolute; left: 0; top: 0; border-radius: 14px; will-change: transform; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    header { position: fixed; left: 16px; right: 16px; top: 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; z-index: 1; }
    #status { color: #9ca3af; }
  </style>
  <script type="module" src="./demo.ts"></script>
</head>
<body>
  <div id="stage"></div>
  <header>
    <strong>Click anywhere to fling.</strong>
    <label>Prediction <select id="mode"><option value="serial">301 separate evaluations</option><option value="batch">one batched evaluation</option></select></label>
    <span id="status"></span>
  </header>
</body>
</html>
