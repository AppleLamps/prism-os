<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Numeric library workload</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101318; color: #d9dee7; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #stats { position: fixed; left: 16px; top: 14px; max-width: 520px; color: #9aa3b2; }
    #stats strong { color: #e6ebf2; font-weight: 600; }
    .icon { position: fixed; left: 0; top: 0; border-radius: 22%; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); will-change: transform; }
    .icon[data-nearest="1"] { outline: 2px solid rgba(255, 255, 255, 0.8); outline-offset: 2px; }
    .tick { position: fixed; left: 0; top: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #5c6778; will-change: transform, opacity; }
    .tick[data-lit="1"] { background: #7dd3a8; }
    #head { position: fixed; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #f5f7fa; }
    #percent { position: fixed; top: 100px; width: 80px; margin-left: -40px; text-align: center; font-size: 20px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="stats"></div>
  <div id="head"></div>
  <div id="percent"></div>
  <script type="module" src="./demo.ts"></script>
</body>
</html>
