<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toggle switch</title>
  <style>
    body {margin: 0; height: 100vh; overflow: hidden; background: #f5f5f7; touch-action: none}
    .track {position: absolute; left: 0; top: 0; width: 52px; height: 32px; border-radius: 16px; cursor: pointer;
      background: color-mix(in srgb, #34c759 calc(var(--fill, 0) * 100%), #d1d1d6);
      filter: brightness(calc(1 - var(--armed, 0) * 0.1))}
    .thumb {position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 12px; background: white;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.3)}
  </style>
</head>
<body>
  <div class="track" role="switch" aria-checked="false"><div class="thumb"></div></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
