<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Differentiable UI</title>
  <link rel="stylesheet" href="./learned-gallery.css">
</head>
<body>
  <main id="learning-demo">
    <header class="learning-header">
      <h1>Differentiable UI</h1>
      <p>Backprop learns the geometry network itself from a rectangle sketch.</p>
    </header>

    <section class="learning-workspace">
      <article>
        <h2>
          <span>Target</span>
          <small>Drag to move · drag corner to scale · click empty space to add · Delete to remove</small>
        </h2>
        <div
          id="learning-target"
          class="learning-stage"
          aria-label="Editable target rectangles"
          tabindex="0"
        ></div>
      </article>
      <article>
        <h2>Learned</h2>
        <div id="learning-result" class="learning-stage" aria-label="Learned photo gallery"></div>
      </article>
    </section>

    <footer class="learning-footer">
      <span><b id="learning-coefficients"></b> trainable coefficients</span>
      <span>loss <b id="learning-loss"></b></span>
    </footer>
  </main>
  <script type="module" src="./learned-gallery.ts"></script>
</body>
</html>
