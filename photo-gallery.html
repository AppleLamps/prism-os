<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery</title>
  <style>
    html {
      background: #111318;
      color: #e7e9ee;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body {
      margin: 0;
      overflow: hidden;
    }
    #canvas {
      position: fixed;
      inset: 0;
      cursor: pointer;
    }
    .rectangle {
      position: absolute;
      border-radius: 18px;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 18%), 0 18px 48px rgb(0 0 0 / 25%);
      pointer-events: none;
    }
    .rectangle:nth-child(1) { background: #ff6b6b; }
    .rectangle:nth-child(2) { background: #f7b731; }
    .rectangle:nth-child(3) { background: #45aaf2; }
    .rectangle:nth-child(4) { background: #a55eea; }
    #readout {
      position: fixed;
      right: 18px;
      bottom: 18px;
      padding: 9px 12px;
      border: 1px solid rgb(255 255 255 / 15%);
      border-radius: 10px;
      background: rgb(0 0 0 / 45%);
      color: rgb(255 255 255 / 78%);
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas">
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
  </div>
  <div id="readout"></div>
  <script type="module" src="./photo-gallery.ts"></script>
</body>
</html>
